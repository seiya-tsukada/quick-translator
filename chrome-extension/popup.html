<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuickLens</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body { width: 380px; padding: 12px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
    .brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 4px; }
    .engine-select { width: auto; padding: 4px 8px; font-size: 12px; }
    .hint { font-size: 11.5px; margin: -4px 0 8px; display: flex; gap: 6px; align-items: center; }
    .hint button { background: none; border: 0; color: var(--accent); text-decoration: underline; cursor: pointer; font-size: inherit; padding: 0; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
    .pill { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
    .pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
    .pill:disabled { opacity: .45; cursor: not-allowed; }
    .more-select { width: auto; padding: 3px 8px; font-size: 12px; border-radius: 999px; }
    .group-label { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
    .source-head { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .source-head button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 11px; text-decoration: underline; }
    .textarea { min-height: 80px; resize: vertical; font-size: 13px; }
    .translate-btn { width: 100%; margin-top: 8px; padding: 9px; }
    .spinner { width: 13px; height: 13px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .result { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); overflow: hidden; }
    .result-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--muted); }
    .result-body { padding: 10px; min-height: 70px; max-height: 240px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; font-size: 13.5px; }
    .result-body.placeholder { color: var(--muted); font-size: 12px; }
    .result-extra { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
    .progress { height: 4px; border-radius: 999px; background: var(--border); overflow: hidden; }
    .progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    .icon-btn { padding: 4px 7px; font-size: 11.5px; }
    .footer-donate { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px; }
    .footer-donate a { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
  </style>
</head>
<body>
  <header class="header">
    <span class="brand"><span class="icon" data-icon="lens" data-icon-size="16"></span>QuickLens</span>
    <div class="header-right">
      <label for="engine-select" class="sr-only" data-i18n="labelEngine"></label>
      <select id="engine-select" class="select engine-select">
        <option value="free" data-i18n="engine_free"></option>
        <option value="openai" data-i18n="engine_openai"></option>
        <option value="deepl" data-i18n="engine_deepl"></option>
      </select>
      <button id="open-options" class="btn ghost icon-btn" data-i18n-attr="aria-label:openSettings;title:openSettings">
        <span class="icon" data-icon="settings" data-icon-size="15"></span>
      </button>
    </div>
  </header>

  <p id="engine-hint" class="hint muted" hidden>
    <span class="icon" data-icon="key" data-icon-size="13"></span>
    <span id="engine-hint-text"></span>
    <button id="engine-hint-link" type="button" data-i18n="registerKey"></button>
  </p>

  <div class="group-label" id="target-label" data-i18n="labelTargetLang"></div>
  <div class="row" id="lang-row" role="group" aria-labelledby="target-label"></div>

  <div class="group-label" id="tone-label" data-i18n="labelTone"></div>
  <div class="row" id="tone-row" role="group" aria-labelledby="tone-label"></div>
  <p id="tone-hint" class="hint muted" hidden></p>

  <div class="source-head">
    <label for="source-input" id="source-label" data-i18n="labelSourceText"></label>
    <span><button id="clear-source" type="button" data-i18n="clear"></button> · <span id="char-count">0</span></span>
  </div>
  <textarea id="source-input" class="textarea" data-i18n-attr="placeholder:sourcePlaceholder"></textarea>

  <button id="translate-btn" class="btn primary translate-btn">
    <span id="translate-spinner" class="spinner" hidden></span>
    <span id="translate-label" data-i18n="translateButton"></span>
  </button>

  <section class="result" aria-labelledby="result-title">
    <div class="result-head">
      <span id="result-title"><span data-i18n="resultTitle"></span> <span id="result-engine"></span></span>
      <span>
        <button id="copy-btn" class="btn ghost icon-btn" data-i18n-attr="aria-label:hudCopy;title:hudCopy">
          <span class="icon" data-icon="copy"></span><span id="copy-label" data-i18n="hudCopyShort"></span>
        </button>
        <button id="speak-btn" class="btn ghost icon-btn" data-i18n-attr="aria-label:hudSpeak;title:hudSpeak">
          <span class="icon" data-icon="speaker"></span>
        </button>
      </span>
    </div>
    <div id="result-body" class="result-body placeholder" aria-live="polite" data-i18n="resultPlaceholder"></div>
    <div class="result-extra">
      <div id="progress" class="progress" hidden><div></div></div>
      <div id="notice" class="notice" role="note" hidden><span class="icon" data-icon="info"></span><span id="notice-text"></span></div>
      <div id="result-actions" class="row" hidden></div>
    </div>
  </section>

  <footer id="donate-footer" class="footer-donate" hidden>
    <a id="donate-link" target="_blank" rel="noopener noreferrer">
      <span class="icon" data-icon="heart" data-icon-size="13"></span>
      <span data-i18n="donatePromptLine"></span>
    </a>
    <button id="donate-dismiss" class="btn ghost icon-btn" data-i18n-attr="aria-label:donateDismiss;title:donateDismiss">
      <span class="icon" data-icon="close" data-icon-size="12"></span>
    </button>
  </footer>

  <script src="config.js"></script>
  <script src="lib/errors.js"></script>
  <script src="lib/languages.js"></script>
  <script src="lib/text-chunker.js"></script>
  <script src="lib/router.js"></script>
  <script src="lib/usage.js"></script>
  <script src="lib/icons.js"></script>
  <script src="lib/theme.js"></script>
  <script src="lib/i18n-dom.js"></script>
  <script src="lib/builtin-translator.js"></script>
  <script src="lib/translate-client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
