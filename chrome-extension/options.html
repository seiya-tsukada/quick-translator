<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="optionsTitle">QuickLens</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    body { padding: 32px 16px 64px; }
    .container { max-width: 680px; margin: 0 auto; }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; color: var(--accent); margin-bottom: 4px; }
    .lead { color: var(--muted); margin-bottom: 20px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    h2 { font-size: 14.5px; display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    .field > label, .field-label { display: block; font-weight: 600; margin-bottom: 4px; }
    .desc { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .select, .input { max-width: 360px; }
    .check { display: flex; gap: 8px; align-items: center; cursor: pointer; }
    .key-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .key-row .input { flex: 1 1 220px; }
    .key-status { font-size: 12px; margin-top: 4px; }
    .key-status.ok { color: var(--success); }
    .key-status.err { color: var(--danger); }
    .key-links { font-size: 12px; margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
    .provider + .provider { border-top: 1px solid var(--border); padding-top: 14px; }
    kbd { font-family: ui-monospace, Menlo, monospace; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 12px; }
    .privacy p + p { margin-top: 6px; }
    .donate { text-align: left; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--success); color: #fff; padding: 7px 16px; border-radius: 999px; font-size: 12px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <main class="container">
    <h1><span class="icon" data-icon="lens" data-icon-size="20"></span><span data-i18n="optionsTitle"></span></h1>
    <p class="lead" data-i18n="optionsLead"></p>

    <section class="card" aria-labelledby="sec-translate">
      <h2 id="sec-translate"><span class="icon" data-icon="device"></span><span data-i18n="sectionTranslation"></span></h2>
      <div class="field">
        <label for="opt-target" data-i18n="labelTargetLang"></label>
        <select id="opt-target" class="select"></select>
      </div>
      <div class="field">
        <label for="opt-source" data-i18n="labelSourceLang"></label>
        <select id="opt-source" class="select"></select>
      </div>
      <div class="field">
        <label for="opt-engine" data-i18n="labelEngine"></label>
        <p class="desc" data-i18n="engineDesc"></p>
        <select id="opt-engine" class="select">
          <option value="free" data-i18n="engineOption_free"></option>
          <option value="gemini" data-i18n="engineOption_gemini"></option>
          <option value="openai" data-i18n="engineOption_openai"></option>
          <option value="deepl" data-i18n="engineOption_deepl"></option>
        </select>
      </div>
      <div class="field">
        <label for="opt-tone" data-i18n="labelTone"></label>
        <p class="desc" data-i18n="toneDesc"></p>
        <select id="opt-tone" class="select">
          <option value="natural" data-i18n="tone_natural"></option>
          <option value="business" data-i18n="tone_business"></option>
          <option value="summary" data-i18n="tone_summary"></option>
          <option value="breakdown" data-i18n="tone_breakdown"></option>
        </select>
      </div>
    </section>

    <section class="card" aria-labelledby="sec-keys">
      <h2 id="sec-keys"><span class="icon" data-icon="key"></span><span data-i18n="sectionKeys"></span></h2>
      <p class="desc" data-i18n="keysDesc"></p>
      <div id="providers"></div>
    </section>

    <section class="card" aria-labelledby="sec-display">
      <h2 id="sec-display"><span class="icon" data-icon="panel"></span><span data-i18n="sectionDisplay"></span></h2>
      <div class="field">
        <label for="opt-position" data-i18n="labelHudPosition"></label>
        <select id="opt-position" class="select">
          <option value="selection" data-i18n="hudPosition_selection"></option>
          <option value="corner" data-i18n="hudPosition_corner"></option>
        </select>
      </div>
      <div class="field">
        <label for="opt-theme" data-i18n="labelTheme"></label>
        <select id="opt-theme" class="select">
          <option value="system" data-i18n="theme_system"></option>
          <option value="light" data-i18n="theme_light"></option>
          <option value="dark" data-i18n="theme_dark"></option>
        </select>
      </div>
      <div class="field">
        <label for="opt-duration" data-i18n="labelToastDuration"></label>
        <select id="opt-duration" class="select">
          <option value="5000" data-i18n="duration_5"></option>
          <option value="10000" data-i18n="duration_10"></option>
          <option value="20000" data-i18n="duration_20"></option>
          <option value="0" data-i18n="duration_manual"></option>
        </select>
      </div>
      <div class="field">
        <label class="check"><input type="checkbox" id="opt-autotranslate"><span data-i18n="labelAutoTranslatePopup"></span></label>
      </div>
    </section>

    <section class="card" aria-labelledby="sec-shortcut">
      <h2 id="sec-shortcut"><span class="icon" data-icon="keyboard"></span><span data-i18n="sectionShortcut"></span></h2>
      <p class="desc"><span data-i18n="shortcutCurrent"></span> <kbd id="shortcut-current"></kbd></p>
      <p class="desc" data-i18n="shortcutHowToChange"></p>
      <button id="open-shortcuts" class="btn" type="button"><span class="icon" data-icon="external"></span><span data-i18n="shortcutOpenSettings"></span></button>
      <p class="desc" style="margin-top:6px"><code>chrome://extensions/shortcuts</code></p>
    </section>

    <section class="card privacy" aria-labelledby="sec-privacy">
      <h2 id="sec-privacy"><span class="icon" data-icon="shield"></span><span data-i18n="sectionPrivacy"></span></h2>
      <p data-i18n="privacyOnDevice"></p>
      <p data-i18n="privacyByok"></p>
      <p data-i18n="privacyKeys"></p>
      <p data-i18n="privacyNoServer"></p>
    </section>

    <section id="donate-section" class="card donate" aria-labelledby="sec-donate" hidden>
      <h2 id="sec-donate"><span class="icon" data-icon="heart"></span><span data-i18n="sectionDonate"></span></h2>
      <p class="desc" data-i18n="donateDesc"></p>
      <a id="donate-link" class="btn" target="_blank" rel="noopener noreferrer"><span class="icon" data-icon="external"></span><span data-i18n="donateButton"></span></a>
    </section>

    <p style="text-align:right">
      <button id="reset-btn" class="btn ghost" type="button" data-i18n="resetSettings"></button>
    </p>
  </main>
  <div id="save-toast" class="toast" role="status" aria-live="polite" data-i18n="savedToast"></div>

  <template id="provider-template">
    <div class="provider field">
      <label class="field-label" data-ref="label"></label>
      <div class="key-row">
        <input type="password" class="input" data-ref="input" autocomplete="off" spellcheck="false">
        <button class="btn primary" type="button" data-ref="save"></button>
        <button class="btn" type="button" data-ref="remove"></button>
      </div>
      <div class="key-status" data-ref="status" aria-live="polite"></div>
      <div class="key-links">
        <a data-ref="get-key" target="_blank" rel="noopener noreferrer"></a>
        <a data-ref="privacy" target="_blank" rel="noopener noreferrer"></a>
      </div>
    </div>
  </template>

  <script src="config.js"></script>
  <script src="lib/languages.js"></script>
  <script src="lib/icons.js"></script>
  <script src="lib/theme.js"></script>
  <script src="lib/i18n-dom.js"></script>
  <script src="crypto-vault.js"></script>
  <script src="options.js"></script>
</body>
</html>
